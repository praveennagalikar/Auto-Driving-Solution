[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "auto-driving"
version = "1.0.0"
description = "Autonomous driving car simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
auto-driving = "auto_driving.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
